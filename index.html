<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブックマークできるマルチ電卓</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // classによるダークモード制御を有効化
        }
    </script>
    <!-- Math.js for safe mathematical evaluation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc; /* Tailwind slate-50 */
        }
        body.dark {
            background-color: #0f172a; /* Tailwind slate-900 */
        }
        /* スクロールバーのスタイル調整 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-200 bg-slate-50 dark:bg-slate-900 h-screen flex flex-col transition-colors duration-200">

    <!-- Header -->
    <header class="bg-white dark:bg-slate-800 shadow-sm border-b border-slate-200 dark:border-slate-700 py-4 px-6 sticky top-0 z-10 flex flex-wrap gap-4 justify-between items-center transition-colors duration-200">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-500 dark:text-indigo-400"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16.01" y1="10" y2="10"/><line x1="12" x2="12.01" y1="10" y2="10"/><line x1="8" x2="8.01" y1="10" y2="10"/><line x1="16" x2="16.01" y1="14" y2="14"/><line x1="12" x2="12.01" y1="14" y2="14"/><line x1="8" x2="8.01" y1="14" y2="14"/><line x1="16" x2="16.01" y1="18" y2="18"/><line x1="12" x2="12.01" y1="18" y2="18"/><line x1="8" x2="8.01" y1="18" y2="18"/></svg>
                ブックマークできるマルチ電卓
            </h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">入力内容はリアルタイムでURLに自動保存されます。</p>
        </div>
        <div class="flex items-center gap-2 sm:gap-3">
            <button id="theme-toggle-btn" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg transition-colors" aria-label="Toggle Dark Mode">
                <!-- Sun Icon (hidden in light mode) -->
                <svg id="theme-icon-sun" class="hidden w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                <!-- Moon Icon (hidden in dark mode) -->
                <svg id="theme-icon-moon" class="block w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
            </button>
            <button id="copy-url-btn" class="bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white font-semibold py-2 px-3 sm:px-4 rounded-lg transition-colors flex items-center gap-2 shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                <span class="hidden sm:inline">URLをコピー</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 pb-24">
        <div id="app-container" class="max-w-7xl mx-auto flex flex-col gap-8">
            <!-- Groups will be injected here via JS -->
        </div>
    </main>

    <!-- Bottom Action Bar (Grand Total & Add Group) -->
    <footer class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-t border-slate-200 dark:border-slate-700 py-3 px-4 sm:px-6 sticky bottom-0 z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] transition-colors duration-200">
        <div class="max-w-7xl mx-auto flex flex-wrap gap-4 justify-between items-center">
            <div class="flex items-center gap-3 bg-indigo-50 dark:bg-indigo-900/40 px-4 py-2 sm:px-6 sm:py-3 rounded-xl border border-indigo-100 dark:border-indigo-800/50 shadow-sm transition-colors flex-1 sm:flex-none">
                <span class="text-sm sm:text-base text-slate-600 dark:text-slate-300 font-bold whitespace-nowrap">全グループ合計:</span>
                <span id="grand-total-val" class="text-2xl sm:text-3xl font-black text-indigo-600 dark:text-indigo-400 truncate max-w-[150px] sm:max-w-[300px]">0</span>
            </div>
            <button id="add-group-btn" class="bg-slate-800 dark:bg-slate-100 hover:bg-slate-700 dark:hover:bg-white text-white dark:text-slate-900 font-bold py-3 px-5 sm:px-6 rounded-xl transition-colors flex items-center gap-2 shadow-md w-full sm:w-auto justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                <span>新しくグループを追加</span>
            </button>
        </div>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-32 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 dark:bg-slate-700 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 z-50 pointer-events-none">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="toast-message">URLをコピーしました！</span>
    </div>

    <script>
        // --- テーマ管理 ---
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const themeIconSun = document.getElementById('theme-icon-sun');
        const themeIconMoon = document.getElementById('theme-icon-moon');

        function applyTheme(isDark) {
            if (isDark) {
                document.body.classList.add('dark');
                themeIconSun.classList.remove('hidden');
                themeIconMoon.classList.add('hidden');
            } else {
                document.body.classList.remove('dark');
                themeIconSun.classList.add('hidden');
                themeIconMoon.classList.remove('hidden');
            }
        }

        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            applyTheme(isDark);
        }

        // 初期テーマのロード (localStorage または OSの設定)
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(savedTheme === 'dark' || (!savedTheme && prefersDark));

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', toggleTheme);
        }

        // --- 状態定義 ---
        // グループとパネルの階層構造
        const defaultState = [
            {
                id: generateId(),
                t: '',
                panels: [
                    { id: generateId(), t: '', e: '' }
                ]
            }
        ];

        let appState = [];

        // DOM Elements
        const appContainer = document.getElementById('app-container');
        const addGroupBtn = document.getElementById('add-group-btn');
        const copyUrlBtn = document.getElementById('copy-url-btn');
        const toast = document.getElementById('toast');
        const grandTotalValEl = document.getElementById('grand-total-val');

        // Initialize App
        function init() {
            loadStateFromURL();
            renderAll();
            
            // パネル・グループ全体のイベント委譲 (Event Delegation)
            appContainer.addEventListener('input', handleInputEvents);
            appContainer.addEventListener('click', handleClickEvents);

            // グループ追加ボタン
            addGroupBtn.addEventListener('click', () => {
                const newGroup = {
                    id: generateId(),
                    t: '新しいグループ',
                    panels: [{ id: generateId(), t: '計算 1', e: '' }]
                };
                appState.push(newGroup);
                saveStateToURL();
                
                appContainer.insertAdjacentHTML('beforeend', createGroupHTML(newGroup));
                const addedGroupEl = appContainer.lastElementChild;
                
                // 初期計算
                updateGroupTotal(addedGroupEl, newGroup.id);
                updateGrandTotal();
                const firstPanelEl = addedGroupEl.querySelector('.calc-panel');
                updatePanelResult(firstPanelEl, newGroup.panels[0].e);
                
                // スクロールを一番下に
                addedGroupEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
            });

            // URLコピーボタン (より堅牢な実装)
            copyUrlBtn.addEventListener('click', () => {
                const url = window.location.href;
                copyToClipboard(url);
            });
        }

        function handleInputEvents(e) {
            const target = e.target;
            
            // パネルの入力
            if (target.classList.contains('panel-title') || target.classList.contains('panel-expr')) {
                const panelEl = target.closest('.calc-panel');
                const groupEl = target.closest('.calc-group');
                if (!panelEl || !groupEl) return;

                const panelId = panelEl.dataset.id;
                const groupId = groupEl.dataset.groupId;
                
                const groupData = appState.find(g => g.id === groupId);
                if(!groupData) return;
                const panelData = groupData.panels.find(p => p.id === panelId);
                if(!panelData) return;

                if (target.classList.contains('panel-title')) {
                    panelData.t = target.value;
                } else {
                    panelData.e = target.value;
                    updatePanelResult(panelEl, panelData.e);
                    updateGroupTotal(groupEl, groupId);
                    updateGrandTotal();
                }
                saveStateToURL();
            }
            
            // グループタイトルの入力
            if (target.classList.contains('group-title')) {
                const groupEl = target.closest('.calc-group');
                const groupId = groupEl.dataset.groupId;
                const groupData = appState.find(g => g.id === groupId);
                if(groupData) {
                    groupData.t = target.value;
                    saveStateToURL();
                }
            }
        }

        function handleClickEvents(e) {
            const target = e.target;
            
            // 電卓キーパッドの表示切替
            const toggleKeypadBtn = target.closest('.toggle-keypad-btn');
            if (toggleKeypadBtn) {
                const keypad = toggleKeypadBtn.closest('.calc-panel').querySelector('.panel-keypad');
                keypad.classList.toggle('hidden');
                return;
            }

            // キーパッドのボタン入力
            const keypadBtn = target.closest('.keypad-btn');
            if (keypadBtn) {
                const panelEl = keypadBtn.closest('.calc-panel');
                const inputEl = panelEl.querySelector('.panel-expr');
                const val = keypadBtn.dataset.val;

                // スマホのネイティブキーボードがポップアップするのを防ぐため focus() は呼ばない
                let start = inputEl.selectionStart || 0;
                let end = inputEl.selectionEnd || 0;
                let text = inputEl.value || "";

                // フォーカスがない状態で初期入力する時は、先頭ではなく末尾に追加する
                if (document.activeElement !== inputEl && start === 0 && end === 0) {
                    start = text.length;
                    end = text.length;
                }

                if (val === 'C') {
                    inputEl.value = '';
                } else if (val === 'BS') { // Backspace
                    if (start === end && start > 0) {
                        inputEl.value = text.slice(0, start - 1) + text.slice(end);
                        inputEl.selectionStart = inputEl.selectionEnd = start - 1;
                    } else if (start !== end) {
                        inputEl.value = text.slice(0, start) + text.slice(end);
                        inputEl.selectionStart = inputEl.selectionEnd = start;
                    }
                } else {
                    inputEl.value = text.slice(0, start) + val + text.slice(end);
                    inputEl.selectionStart = inputEl.selectionEnd = start + val.length;
                }

                // 強制的にinputイベントを発火させて計算とURL保存を実行
                inputEl.dispatchEvent(new Event('input', { bubbles: true }));
                return;
            }
            
            // パネル削除
            const delBtn = target.closest('.delete-btn');
            if (delBtn) {
                const panelEl = delBtn.closest('.calc-panel');
                const groupEl = panelEl.closest('.calc-group');
                const panelId = panelEl.dataset.id;
                const groupId = groupEl.dataset.groupId;
                
                const groupData = appState.find(g => g.id === groupId);
                if(groupData) {
                    groupData.panels = groupData.panels.filter(p => p.id !== panelId);
                    panelEl.remove();
                    updateGroupTotal(groupEl, groupId);
                    updateGrandTotal();
                    saveStateToURL();
                }
                return;
            }
            
            // グループ削除
            const delGroupBtn = target.closest('.delete-group-btn');
            if (delGroupBtn) {
                const groupEl = delGroupBtn.closest('.calc-group');
                const groupId = groupEl.dataset.groupId;
                appState = appState.filter(g => g.id !== groupId);
                groupEl.remove();
                updateGrandTotal();
                saveStateToURL();
                return;
            }
            
            // パネル追加
            const addPanelBtn = target.closest('.add-panel-btn');
            if (addPanelBtn) {
                const groupEl = addPanelBtn.closest('.calc-group');
                const groupId = groupEl.dataset.groupId;
                const groupData = appState.find(g => g.id === groupId);
                
                if(groupData) {
                    const newPanel = { id: generateId(), t: '新しい計算', e: '' };
                    groupData.panels.push(newPanel);
                    
                    const panelsContainer = groupEl.querySelector('.group-panels');
                    panelsContainer.insertAdjacentHTML('beforeend', createPanelHTML(newPanel));
                    
                    const addedEl = panelsContainer.lastElementChild;
                    updatePanelResult(addedEl, newPanel.e);
                    
                    saveStateToURL();
                }
                return;
            }
        }

        function generateId() {
            return Math.random().toString(36).substring(2, 9);
        }

        function loadStateFromURL() {
            const hash = window.location.hash;
            if (hash && hash.length > 1) {
                try {
                    const decoded = decodeURIComponent(atob(hash.substring(1)));
                    let loadedState = JSON.parse(decoded);
                    if (!Array.isArray(loadedState)) throw new Error("Invalid state format");
                    
                    appState = loadedState;
                } catch (e) {
                    console.error("URLの読み込みに失敗しました", e);
                    appState = JSON.parse(JSON.stringify(defaultState));
                }
            } else {
                appState = JSON.parse(JSON.stringify(defaultState));
            }
        }

        function saveStateToURL() {
            try {
                const encoded = btoa(encodeURIComponent(JSON.stringify(appState)));
                history.replaceState(null, '', '#' + encoded);
            } catch (e) {
                console.error("URLの保存に失敗しました", e);
            }
        }

        function evaluateMath(expr) {
            if (!expr || !expr.trim()) return { val: 0, text: '' };
            try {
                let res = math.evaluate(expr);
                
                if (res && res.entries) {
                    for (let i = res.entries.length - 1; i >= 0; i--) {
                        if (res.entries[i] !== undefined && typeof res.entries[i] !== 'function') {
                            res = res.entries[i];
                            break;
                        }
                    }
                }

                if (res === undefined || typeof res === 'function') return { val: 0, text: '' };

                if (typeof res === 'number') {
                    const rounded = math.round(res, 10); 
                    return {
                        val: rounded,
                        text: new Intl.NumberFormat('ja-JP', { maximumFractionDigits: 4 }).format(rounded)
                    };
                }
                
                return { val: 0, text: res.toString() };
            } catch (e) {
                return { val: 0, text: '<span class="text-rose-500 font-medium text-sm">Error</span>' };
            }
        }

        function updatePanelResult(panelEl, expr) {
            const resultEl = panelEl.querySelector('.panel-result');
            const result = evaluateMath(expr);
            resultEl.innerHTML = result.text || '<span class="text-slate-400 text-sm">...</span>';
        }

        function updateGroupTotal(groupEl, groupId) {
            const groupData = appState.find(g => g.id === groupId);
            if (!groupData) return;
            
            let total = 0;
            groupData.panels.forEach(p => {
                const res = evaluateMath(p.e);
                total += res.val;
            });
            
            const totalEl = groupEl.querySelector('.group-total-val');
            if (totalEl) {
                totalEl.textContent = new Intl.NumberFormat('ja-JP', { maximumFractionDigits: 4 }).format(total);
            }
        }

        function updateGrandTotal() {
            let grandTotal = 0;
            appState.forEach(group => {
                group.panels.forEach(p => {
                    const res = evaluateMath(p.e);
                    grandTotal += res.val;
                });
            });
            if (grandTotalValEl) {
                grandTotalValEl.textContent = new Intl.NumberFormat('ja-JP', { maximumFractionDigits: 4 }).format(grandTotal);
            }
        }

        function createPanelHTML(panel) {
            return `
                <div class="calc-panel bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col transition-all hover:shadow-md dark:hover:shadow-slate-900/50" data-id="${panel.id}">
                    <div class="bg-slate-50 dark:bg-slate-700/50 border-b border-slate-200 dark:border-slate-700 p-2 flex justify-between items-center group transition-colors">
                        <input type="text" value="${escapeHTML(panel.t)}" class="panel-title text-sm bg-transparent font-medium text-slate-600 dark:text-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-800 rounded px-2 py-1 w-full mr-2 transition-colors placeholder-slate-400 dark:placeholder-slate-500" placeholder="タイトル（省略可）">
                        <!-- 削除アイコンを常時表示 -->
                        <button class="delete-btn text-slate-400 hover:text-rose-500 dark:text-slate-500 dark:hover:text-rose-400 p-1 rounded transition-colors" title="削除">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        </button>
                    </div>
                    <div class="p-4 flex flex-col gap-2">
                        <div class="relative flex items-center">
                            <input type="text" class="panel-expr w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-lg p-3 pr-12 font-mono text-base text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all placeholder-slate-400 dark:placeholder-slate-500" placeholder="例: 1000 + 200 * 3" value="${escapeHTML(panel.e)}">
                            <button class="toggle-keypad-btn absolute right-2 p-2 text-slate-400 hover:text-indigo-500 dark:text-slate-500 dark:hover:text-indigo-400 transition-colors rounded-md hover:bg-slate-200 dark:hover:bg-slate-700" title="電卓キーパッド">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16.01" y1="10" y2="10"/><line x1="12" x2="12.01" y1="10" y2="10"/><line x1="8" x2="8.01" y1="10" y2="10"/><line x1="16" x2="16.01" y1="14" y2="14"/><line x1="12" x2="12.01" y1="14" y2="14"/><line x1="8" x2="8.01" y1="14" y2="14"/><line x1="16" x2="16.01" y1="18" y2="18"/><line x1="12" x2="12.01" y1="18" y2="18"/><line x1="8" x2="8.01" y1="18" y2="18"/></svg>
                            </button>
                        </div>
                        
                        <!-- 電卓キーパッド (デフォルト非表示) -->
                        <div class="panel-keypad hidden grid grid-cols-4 gap-2 mt-2 bg-slate-100 dark:bg-slate-900/50 p-3 rounded-lg border border-slate-200 dark:border-slate-700">
                            <button class="keypad-btn col-span-2 bg-rose-100 dark:bg-rose-900/40 text-rose-600 dark:text-rose-400 font-bold py-2 rounded shadow-sm hover:bg-rose-200 dark:hover:bg-rose-800/60 transition-colors" data-val="C">C</button>
                            <button class="keypad-btn bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold py-2 rounded shadow-sm hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors flex justify-center items-center" data-val="BS">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
                            </button>
                            <button class="keypad-btn bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-400 font-bold py-2 rounded shadow-sm hover:bg-indigo-200 dark:hover:bg-indigo-800/70 transition-colors" data-val="/">÷</button>
                            
                            <button class="keypad-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 font-bold py-2 rounded shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" data-val="7">7</button>
                            <button class="keypad-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 font-bold py-2 rounded shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" data-val="8">8</button>
                            <button class="keypad-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 font-bold py-2 rounded shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" data-val="9">9</button>
                            <button class="keypad-btn bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-400 font-bold py-2 rounded shadow-sm hover:bg-indigo-200 dark:hover:bg-indigo-800/70 transition-colors" data-val="*">×</button>
                            
                            <button class="keypad-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 font-bold py-2 rounded shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" data-val="4">4</button>
                            <button class="keypad-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 font-bold py-2 rounded shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" data-val="5">5</button>
                            <button class="keypad-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 font-bold py-2 rounded shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" data-val="6">6</button>
                            <button class="keypad-btn bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-400 font-bold py-2 rounded shadow-sm hover:bg-indigo-200 dark:hover:bg-indigo-800/70 transition-colors" data-val="-">-</button>
                            
                            <button class="keypad-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 font-bold py-2 rounded shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" data-val="1">1</button>
                            <button class="keypad-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 font-bold py-2 rounded shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" data-val="2">2</button>
                            <button class="keypad-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 font-bold py-2 rounded shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" data-val="3">3</button>
                            <button class="keypad-btn bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-400 font-bold py-2 rounded shadow-sm hover:bg-indigo-200 dark:hover:bg-indigo-800/70 transition-colors" data-val="+">+</button>
                            
                            <button class="keypad-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 font-bold py-2 rounded shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" data-val="0">0</button>
                            <button class="keypad-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 font-bold py-2 rounded shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" data-val=".">.</button>
                            <button class="keypad-btn bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold py-2 rounded shadow-sm hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors" data-val="(">(</button>
                            <button class="keypad-btn bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold py-2 rounded shadow-sm hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors" data-val=")">)</button>
                        </div>

                        <div class="flex items-center justify-between mt-1">
                            <span class="text-slate-400 dark:text-slate-500 font-bold ml-2">=</span>
                            <div class="panel-result text-right text-2xl font-bold text-indigo-600 dark:text-indigo-400 truncate w-full pl-4"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function createGroupHTML(group) {
            const panelsHtml = group.panels.map(createPanelHTML).join('');
            return `
                <div class="calc-group bg-white dark:bg-slate-800 p-4 sm:p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm relative transition-colors" data-group-id="${group.id}">
                    <div class="flex flex-row justify-between items-center mb-5 gap-3 border-b border-slate-100 dark:border-slate-700 pb-4">
                        <input type="text" class="group-title text-xl font-bold text-slate-800 dark:text-white bg-transparent focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:bg-slate-700/50 rounded px-2 py-1 w-full sm:w-2/3 transition-colors" value="${escapeHTML(group.t)}" placeholder="グループ名">
                        
                        <button class="delete-group-btn text-slate-400 hover:text-rose-500 dark:text-slate-500 dark:hover:text-rose-400 p-2 rounded transition-colors bg-slate-50 hover:bg-rose-50 dark:bg-slate-700/50 dark:hover:bg-rose-900/30 shrink-0" title="グループを削除">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        </button>
                    </div>
                    
                    <div class="group-panels grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${panelsHtml}
                    </div>
                    
                    <div class="flex flex-col sm:flex-row justify-between items-center mt-6 pt-5 border-t border-slate-100 dark:border-slate-700 gap-4">
                        <button class="add-panel-btn flex items-center gap-2 text-indigo-600 dark:text-indigo-400 font-medium text-sm hover:text-indigo-700 dark:hover:text-indigo-300 bg-indigo-50 dark:bg-indigo-900/30 hover:bg-indigo-100 dark:hover:bg-indigo-900/50 px-4 py-2.5 rounded-lg transition-colors w-full sm:w-auto justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            パネルを追加
                        </button>
                        
                        <div class="bg-indigo-50 dark:bg-indigo-900/40 px-5 py-3 rounded-xl border border-indigo-100 dark:border-indigo-800/50 flex items-center gap-3 transition-colors w-full sm:w-auto justify-between sm:justify-end shadow-sm">
                            <span class="text-sm text-slate-500 dark:text-slate-400 font-bold">グループ合計:</span>
                            <span class="group-total-val text-2xl font-black text-indigo-600 dark:text-indigo-400 truncate max-w-[150px] sm:max-w-[250px]">0</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAll() {
            appContainer.innerHTML = appState.map(createGroupHTML).join('');
            
            // 全グループとパネルの結果を初期計算
            document.querySelectorAll('.calc-group').forEach(groupEl => {
                const groupId = groupEl.dataset.groupId;
                updateGroupTotal(groupEl, groupId);
                
                groupEl.querySelectorAll('.calc-panel').forEach(panelEl => {
                    const panelId = panelEl.dataset.id;
                    const groupData = appState.find(g => g.id === groupId);
                    const panelData = groupData.panels.find(p => p.id === panelId);
                    if (panelData) updatePanelResult(panelEl, panelData.e);
                });
            });
            
            updateGrandTotal();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(showToast).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            textArea.setSelectionRange(0, 99999); // iOS対応
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
            }
            document.body.removeChild(textArea);
        }

        function showToast() {
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // 起動
        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
